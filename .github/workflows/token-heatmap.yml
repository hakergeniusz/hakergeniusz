name: Token Heatmap

# Renders token-heatmap.svg from token-usage-daily.json. The local
# metrics-sync timer pushes fresh usage data (and this renderer) whenever
# the token count changes (checked every 15 min); each such push re-renders
# here. No external services, no extra secrets — the series JSON and the
# renderer are vendored into this repo by the sync script.
on:
  push:
    paths:
      - token-usage-daily.json
      - token-heatmap.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: token-heatmap
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render token heatmap
        run: python3 token-heatmap.py --series token-usage-daily.json --output token-heatmap.svg

      - name: Commit token-heatmap.svg
        run: |
          git config user.name "hakergeniusz"
          git config user.email "hakergeniusz@users.noreply.github.com"
          git add token-heatmap.svg
          git diff --cached --quiet || git commit -m "chore: token heatmap [skip ci]"
          git pull --rebase -q origin main || true
          git push
