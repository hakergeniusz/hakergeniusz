name: Daily Profile Metrics

on:
  schedule:
    - cron: '0 0 * * *'   # midnight UTC, once per day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Self-hosted metrics SVG — no external Vercel services
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: hakergeniusz
          template: classic
          base: header, activity, community, repositories, metadata
          filename: metrics.svg
          output_format: svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # lowlighter/metrics commits metrics.svg itself with [Skip GitHub Action]
