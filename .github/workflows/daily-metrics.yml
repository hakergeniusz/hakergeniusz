name: Daily Profile Metrics

# GitHub-side schedule only — runs whether or not the local box is on.
# (Cron is UTC; GitHub may delay scheduled runs by some minutes under load.)
on:
  schedule:
    # :37 on purpose — on-the-hour slots are the most congested on Actions;
    # GitHub delays those runs by minutes-to-hours and silently drops some
    # (observed: whole slots missing on 2026-11-02/03 with '0 */6 * * *').
    - cron: '37 */6 * * *'   # 00:37, 06:37, 12:37, 18:37 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    # x64 standard runner — the metrics image needs google-chrome-stable, which
    # Google ships for amd64 only, so ARM runners cannot build it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Self-hosted metrics SVG — no external Vercel services.
      # output_action: none leaves the render in /metrics_renders; we post-process
      # and commit it ourselves below.
      # GITHUB_TOKEN is an installation token scoped to this repo only — metrics
      # would see just this one repository. Set METRICS_TOKEN (fine-grained PAT,
      # "Public repositories" read-only) to count all public repos.
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: hakergeniusz
          template: classic
          base: header, activity, community, repositories, metadata
          filename: metrics.svg
          output_format: svg
          output_action: none
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # the classic template hard-codes the sponsor fields; drop them
      - name: Strip sponsor fields
        run: |
          cp /metrics_renders/metrics.svg metrics.svg
          python3 - <<'PY'
          import re
          svg = open("metrics.svg", encoding="utf-8").read()
          svg, n = re.subn(
              r'<div class="field">\s*<svg(?:(?!</div>).)*?</svg>(?:(?!</div>).)*?[Ss]ponsor(?:(?!</div>).)*?</div>',
              "", svg, flags=re.S,
          )
          print(f"stripped {n} sponsor field(s)")
          open("metrics.svg", "w", encoding="utf-8").write(svg)
          PY

      - name: Commit metrics.svg
        run: |
          git config user.name "hakergeniusz"
          git config user.email "hakergeniusz@users.noreply.github.com"
          git add metrics.svg
          git diff --cached --quiet || git commit -m "chore: metrics [skip ci]"
          # main moves between checkout and push (heatmap pushes from the local
          # timer) — a bare push raced one on 2026-11-01 and failed the run
          git pull --rebase -q origin main || true
          git push origin main || { git pull --rebase -q origin main; git push origin main; }
